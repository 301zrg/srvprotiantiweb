# Put this file beside conf/nginx.conf and include neos-tunnel.conf inside http { ... }.
# cloudflared -> 127.0.0.1:7978 -> Neos 127.0.0.1:7977.
# Only a local Cloudflare connector may reach this listener.
map_hash_bucket_size 128;
map $http_origin $neos_tunnel_origin_allowed {
    default 0;
    "http://localhost:5173" 1;
    "http://127.0.0.1:5173" 1;
    "http://localhost:4173" 1;
    "http://127.0.0.1:4173" 1;
    # Replace this exact origin with the actual static website address before upload.
    "https://srvprotiantiweb.pages.dev" 1;
}

map $http_cf_connecting_ip $neos_tunnel_ip_valid {
    default 0;
    "~^[0-9]{1,3}([.][0-9]{1,3}){3}$" 1;
    ~^[0-9A-Fa-f]*:[0-9A-Fa-f:]+$ 1;
}

limit_req_zone $http_cf_connecting_ip zone=neos_tunnel_handshakes:1m rate=30r/m;

log_format neos_tunnel '$http_cf_connecting_ip [$time_local] '
                      '"$request_method $uri $server_protocol" $status';

server {
    listen 127.0.0.1:7978;
    server_name _;
    access_log logs/neos-tunnel-access.log neos_tunnel;

    location = /neos {
        if ($neos_tunnel_origin_allowed = 0) { return 403; }
        if ($neos_tunnel_ip_valid = 0) { return 403; }

        limit_req zone=neos_tunnel_handshakes burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:7977;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Overwrite untrusted client XFF. $remote_addr here is the local connector.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / { return 404; }
}
